name: notebook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the packages the first notebook cell installs
        run: python -m pip install google-genai chromadb sentence-transformers pypdf
      - name: Run setup, chunk preview, and on-disk Chroma
        run: python scripts/execute_notebook.py
